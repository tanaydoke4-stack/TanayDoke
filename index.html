<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      margin: 0;
      animation: fadeIn 1s ease-in;
      min-height: 100vh;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    h2 {
      text-align: center;
      margin-bottom: 5px;
      animation: slideInFromTop 0.8s ease-out, glow 2s ease-in-out infinite alternate;
      color: #fff;
      text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #667eea;
      font-size: 2.5em;
    }
    @keyframes slideInFromTop {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #667eea; }
      to { text-shadow: 0 0 15px #fff, 0 0 30px #fff, 0 0 45px #667eea; }
    }
    #table {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #fff;
      font-size: 1.2em;
    }
    .item {
      background: linear-gradient(145deg, #ffffff, #f0f0f0);
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      animation: fadeInUp 0.6s ease-out forwards, float 3s ease-in-out infinite;
      opacity: 0;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .item:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.2), 0 0 20px rgba(102, 126, 234, 0.5), 0 0 40px rgba(102, 126, 234, 0.3);
      border-color: #667eea;
    }
    .item:nth-child(1) { animation-delay: 0.1s; }
    .item:nth-child(2) { animation-delay: 0.2s; }
    .item:nth-child(3) { animation-delay: 0.3s; }
    .item:nth-child(4) { animation-delay: 0.4s; }
    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item h3 {
      margin: 0;
      color: #333;
      font-size: 1.4em;
    }
    .price {
      color: #ff6b6b;
      font-weight: bold;
      font-size: 1.2em;
      background: rgba(255, 107, 107, 0.1);
      padding: 5px 10px;
      border-radius: 20px;
    }
    .qty-row {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="number"] {
      width: 80px;
      padding: 8px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s ease;
    }
    input[type="number"]:focus {
      border-color: #667eea;
      outline: none;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    button:hover {
      background: linear-gradient(45deg, #764ba2, #667eea);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
      50% { box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4); }
      100% { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    }
    button:active {
      transform: scale(0.95);
    }
    #placeAllBtn {
      display: block;
      margin: 20px auto;
      padding: 15px 30px;
      font-size: 1.2em;
      background: linear-gradient(45deg, #ff6b6b, #ffa726);
    }
    #placeAllBtn:hover {
      animation: bounce 0.6s ease;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    #globalMsg {
      text-align: center;
      margin-top: 20px;
      color: #4caf50;
      animation: slideInFromBottom 0.5s ease-out, bounce 0.6s ease 0.5s;
      opacity: 0;
      font-size: 1.1em;
      background: rgba(76, 175, 80, 0.1);
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #4caf50;
      transition: all 0.3s ease;
    }
    #globalMsg.glow {
      animation: slideInFromBottom 0.5s ease-out, bounce 0.6s ease 0.5s, messageGlow 1s ease-in-out infinite alternate;
      text-shadow: 0 0 10px #4caf50, 0 0 20px #4caf50;
      border-color: #4caf50;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
    }
    @keyframes messageGlow {
      from { text-shadow: 0 0 10px #4caf50, 0 0 20px #4caf50; box-shadow: 0 0 20px rgba(76, 175, 80, 0.5); }
      to { text-shadow: 0 0 15px #4caf50, 0 0 30px #4caf50; box-shadow: 0 0 30px rgba(76, 175, 80, 0.7); }
    }
    @keyframes slideInFromBottom {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #totalPrice {
      text-align: center;
      margin-top: 20px;
      font-size: 1.5em;
      font-weight: bold;
      color: #fff;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      animation: fadeIn 1s ease-in 0.5s both;
    }
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeOut 2s ease-in-out 3s forwards;
    }
    .welcome-message {
      text-align: center;
      color: #fff;
      font-size: 2em;
      animation: zoomIn 1s ease-out;
    }
    .welcome-message h1 {
      margin: 0;
      font-size: 3em;
      text-shadow: 0 0 20px #667eea;
    }
    .welcome-message p {
      margin: 10px 0 0 0;
      font-size: 1.2em;
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
    @keyframes zoomIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @media (max-width: 600px) {
      .item-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .qty-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      input[type="number"] {
        width: 100%;
      }
      button {
        width: 100%;
      }
      h2 {
        font-size: 2em;
      }
      .welcome-message h1 {
        font-size: 2em;
      }
      .welcome-message p {
        font-size: 1em;
      }
    }
  </style>
</head>

<body>
  <div class="welcome-overlay">
    <div class="welcome-message">
      <h1>Welcome to Smart Menu!</h1>
      <p>Enjoy your dining experience</p>
    </div>
  </div>
  <h2>Smart Menu</h2>
  <p id="table"></p>
  <p id="globalMsg"></p>
  <p id="totalPrice"></p>

  <button id="placeAllBtn" onclick="placeAllOrders()">Place All Orders</button>

  <!-- Example items -->
  <div class="item">
    <div class="item-header">
      <h3>Veg Burger</h3>
      <span class="price">₹120</span>
    </div>
    <div class="qty-row">
      Qty:
      <input type="number" id="qty-burger" value="1" min="0">
      <button onclick="placeOrder('Veg Burger', 'qty-burger')">Order</button>
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <h3>French Fries</h3>
      <span class="price">₹80</span>
    </div>
    <div class="qty-row">
      Qty:
      <input type="number" id="qty-fries" value="1" min="0">
      <button onclick="placeOrder('French Fries', 'qty-fries')">Order</button>
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <h3>Pizza</h3>
      <span class="price">₹250</span>
    </div>
    <div class="qty-row">
      Qty:
      <input type="number" id="qty-pizza" value="1" min="0">
      <button onclick="placeOrder('Pizza', 'qty-pizza')">Order</button>
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <h3>Drink</h3>
      <span class="price">₹50</span>
    </div>
    <div class="qty-row">
      Qty:
      <input type="number" id="qty-drink" value="1" min="0">
      <button onclick="placeOrder('Drink', 'qty-drink')">Order</button>
    </div>
  </div>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    // 🔥 Your Firebase config (copy from Firebase console)
    // Go to Project settings > Your apps > Web app > SDK setup & configuration (Config).[web:17]
    var firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    // Get table number from URL, e.g. smart-menu.html?table=5
    const urlParams = new URLSearchParams(window.location.search);
    const table = urlParams.get('table');

    const tableEl = document.getElementById("table");
    if (!table) {
      tableEl.innerText = "Table not set. Please scan the correct QR code.";
    } else {
      tableEl.innerText = "Table No: " + table;
    }

    // Prices for items
    const prices = {
      'Veg Burger': 120,
      'French Fries': 80,
      'Pizza': 250,
      'Drink': 50
    };

    function calculateTotal() {
      let total = 0;
      total += parseInt(document.getElementById('qty-burger').value || 0) * prices['Veg Burger'];
      total += parseInt(document.getElementById('qty-fries').value || 0) * prices['French Fries'];
      total += parseInt(document.getElementById('qty-pizza').value || 0) * prices['Pizza'];
      total += parseInt(document.getElementById('qty-drink').value || 0) * prices['Drink'];
      document.getElementById('totalPrice').innerText = 'Total: ₹' + total;
    }

    // Add event listeners to quantity inputs
    document.getElementById('qty-burger').addEventListener('input', calculateTotal);
    document.getElementById('qty-fries').addEventListener('input', calculateTotal);
    document.getElementById('qty-pizza').addEventListener('input', calculateTotal);
    document.getElementById('qty-drink').addEventListener('input', calculateTotal);

    function placeOrder(itemName, qtyInputId) {
      if (!table) {
        alert("Invalid table. Ask staff for help.");
        return;
      }

      var qtyValue = parseInt(document.getElementById(qtyInputId).value, 10);
      if (!qtyValue || qtyValue < 1) {
        alert("Please enter a valid quantity.");
        return;
      }

      var orderData = {
        table: table,
        item: itemName,
        quantity: qtyValue,
        time: new Date().toLocaleTimeString()
      };

      db.ref("orders").push(orderData)
        .then(function () {
          const msgEl = document.getElementById("globalMsg");
          msgEl.innerText = "Order placed: " + itemName + " x" + qtyValue + " (Table " + table + ")";
          msgEl.classList.add("glow");
          setTimeout(() => msgEl.classList.remove("glow"), 3000); // Remove glow after 3 seconds
          // Optional: clear quantity back to 1
          document.getElementById(qtyInputId).value = 1;
          calculateTotal(); // Update total after order
        })
        .catch(function (error) {
          console.error(error);
          alert("Failed to place order. Please try again.");
        });
    }

    function placeAllOrders() {
      if (!table) {
        alert("Invalid table. Ask staff for help.");
        return;
      }

      const items = [
        { name: 'Veg Burger', id: 'qty-burger' },
        { name: 'French Fries', id: 'qty-fries' },
        { name: 'Pizza', id: 'qty-pizza' },
        { name: 'Drink', id: 'qty-drink' }
      ];

      let ordersPlaced = 0;
      let totalOrders = 0;

      items.forEach(item => {
        const qtyValue = parseInt(document.getElementById(item.id).value, 10);
        if (qtyValue > 0) {
          totalOrders++;
          const orderData = {
            table: table,
            item: item.name,
            quantity: qtyValue,
            time: new Date().toLocaleTimeString()
          };

          db.ref("orders").push(orderData)
            .then(function () {
              ordersPlaced++;
              if (ordersPlaced === totalOrders) {
                const msgEl = document.getElementById("globalMsg");
                msgEl.innerText = "All orders placed successfully! (Table " + table + ")";
                msgEl.classList.add("glow");
                setTimeout(() => msgEl.classList.remove("glow"), 3000); // Remove glow after 3 seconds
                // Reset quantities to 1
                items.forEach(i => document.getElementById(i.id).value = 1);
                calculateTotal();
              }
            })
            .catch(function (error) {
              console.error(error);
              alert("Failed to place order for " + item.name + ". Please try again.");
            });
        }
      });

      if (totalOrders === 0) {
        alert("No items selected. Please set quantities greater than 0.");
      }
    }
  </script>
</body>
</html>
